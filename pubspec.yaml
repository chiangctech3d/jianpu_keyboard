name: jianpu_keyboard
description: "Teclado de jianpu (partitura numérica)"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  win32: ^6.4.0
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Fontes do design_louvor (OFL, ver assets/fonts/OFL.txt). Variáveis: o
  # peso vem de FontVariation('wght').
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
    - family: Noto Sans Mono
      fonts:
        - asset: assets/fonts/NotoSansMono.ttf
    - family: Noto Music
      fonts:
        - asset: assets/fonts/NotoMusic.ttf
